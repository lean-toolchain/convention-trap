name = "convention-trap"
version = "0.1.0"
defaultTargets = ["ConventionTrap"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[lean_lib]]
name = "ConventionTrap"

[[lean_lib]]
name = "ConventionTrapTest"
srcDir = "test"
globs = ["ConventionTrapTest.+"]
